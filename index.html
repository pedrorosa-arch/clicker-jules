<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      color: #3e2723;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #4a2c11;
    }

    .counter-display {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: #6d4c41;
    }

    .count-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: #d84315;
      display: inline-block;
      transition: transform 0.1s ease;
    }

    .cookie-wrapper {
      position: relative;
      display: inline-block;
      cursor: pointer;
      margin: 1rem 0;
    }

    .cookie {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e0a96d, #b87333);
      box-shadow: inset -8px -8px 15px rgba(0, 0, 0, 0.3),
                  inset 8px 8px 15px rgba(255, 255, 255, 0.3),
                  0 8px 25px rgba(0, 0, 0, 0.2);
      position: relative;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .cookie:hover {
      transform: scale(1.05);
    }

    .cookie:active {
      transform: scale(0.95);
    }

    /* Chocolate Chips */
    .chip {
      position: absolute;
      background-color: #3e2723;
      border-radius: 40% 60% 70% 30% / 50% 60% 40% 50%;
      box-shadow: inset -1px -1px 2px rgba(255, 255, 255, 0.2);
    }

    .chip-1 { width: 22px; height: 20px; top: 30px; left: 45px; transform: rotate(15deg); }
    .chip-2 { width: 25px; height: 22px; top: 40px; right: 40px; transform: rotate(-25deg); }
    .chip-3 { width: 20px; height: 18px; top: 85px; left: 80px; transform: rotate(45deg); }
    .chip-4 { width: 24px; height: 20px; bottom: 35px; left: 40px; transform: rotate(10deg); }
    .chip-5 { width: 22px; height: 22px; bottom: 40px; right: 45px; transform: rotate(-15deg); }
    .chip-6 { width: 18px; height: 16px; top: 80px; left: 25px; transform: rotate(30deg); }
    .chip-7 { width: 19px; height: 18px; top: 85px; right: 25px; transform: rotate(-40deg); }

    /* Floating +1 animation */
    .floating-text {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: #d84315;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px) scale(1.3);
      }
    }

    /* Achievements section */
    .achievements-section {
      margin-top: 1.5rem;
      border-top: 1px solid rgba(109, 76, 65, 0.2);
      padding-top: 1rem;
    }

    .achievements-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4a2c11;
      margin-bottom: 0.8rem;
    }

    .trophies-container {
      display: flex;
      justify-content: space-around;
      gap: 0.5rem;
    }

    .trophy-card {
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid #d7ccc8;
      border-radius: 12px;
      padding: 0.6rem 0.4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      opacity: 0.5;
      filter: grayscale(100%);
      position: relative;
    }

    .trophy-card.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      border-color: #fbc02d;
      background: linear-gradient(135deg, #fffde7 0%, #fff9c4 100%);
      box-shadow: 0 4px 10px rgba(251, 192, 45, 0.3);
      transform: translateY(-2px);
    }

    .trophy-icon {
      font-size: 1.8rem;
      margin-bottom: 0.2rem;
    }

    .trophy-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #5d4037;
    }

    .trophy-threshold {
      font-size: 0.7rem;
      color: #8d6e63;
    }

    /* Achievement notification banner/toast */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: #43a047;
      color: white;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .controls {
      margin-top: 1.5rem;
    }

    .btn-reset {
      background-color: #8d6e63;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-reset:hover {
      background-color: #6d4c41;
    }

    .btn-reset:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cookie Clicker</h1>
    <div class="counter-display">
      Clicks: <span id="count" class="count-number">0</span>
    </div>

    <div class="cookie-wrapper" id="cookie-btn">
      <div class="cookie">
        <div class="chip chip-1"></div>
        <div class="chip chip-2"></div>
        <div class="chip chip-3"></div>
        <div class="chip chip-4"></div>
        <div class="chip chip-5"></div>
        <div class="chip chip-6"></div>
        <div class="chip chip-7"></div>
      </div>
    </div>

    <div class="achievements-section">
      <div class="achievements-title">Achievements</div>
      <div class="trophies-container">
        <div class="trophy-card" id="trophy-10" data-threshold="10">
          <div class="trophy-icon">🥉</div>
          <div class="trophy-label">Bronze</div>
          <div class="trophy-threshold">10 Clicks</div>
        </div>
        <div class="trophy-card" id="trophy-100" data-threshold="100">
          <div class="trophy-icon">🥈</div>
          <div class="trophy-label">Silver</div>
          <div class="trophy-threshold">100 Clicks</div>
        </div>
        <div class="trophy-card" id="trophy-1000" data-threshold="1000">
          <div class="trophy-icon">🥇</div>
          <div class="trophy-label">Gold</div>
          <div class="trophy-threshold">1,000 Clicks</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="reset-btn" class="btn-reset">Reset Counter</button>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
