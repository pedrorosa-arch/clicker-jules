<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow-x: hidden;
      color: #3e2723;
      padding: 20px 10px;
    }

    /* Toast Notification */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: #3e2723;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 5px solid #ffb300;
      animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeOut 0.5s ease 3.5s forwards;
      pointer-events: auto;
    }

    .toast-icon {
      font-size: 1.5rem;
    }

    .toast-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: #ffb300;
    }

    .toast-desc {
      font-size: 0.85rem;
      color: #e0e0e0;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      max-width: 460px;
      width: 100%;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #4a2c11;
    }

    .counter-display {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #6d4c41;
    }

    .count-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: #d84315;
      display: inline-block;
      transition: transform 0.1s ease;
    }

    .cookie-wrapper {
      position: relative;
      display: inline-block;
      cursor: pointer;
      margin: 0.5rem 0 1.5rem 0;
    }

    .cookie {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e0a96d, #b87333);
      box-shadow: inset -8px -8px 15px rgba(0, 0, 0, 0.3),
                  inset 8px 8px 15px rgba(255, 255, 255, 0.3),
                  0 8px 25px rgba(0, 0, 0, 0.2);
      position: relative;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .cookie:hover {
      transform: scale(1.05);
    }

    .cookie:active {
      transform: scale(0.95);
    }

    /* Chocolate Chips */
    .chip {
      position: absolute;
      background-color: #3e2723;
      border-radius: 40% 60% 70% 30% / 50% 60% 40% 50%;
      box-shadow: inset -1px -1px 2px rgba(255, 255, 255, 0.2);
    }

    .chip-1 { width: 22px; height: 20px; top: 30px; left: 45px; transform: rotate(15deg); }
    .chip-2 { width: 25px; height: 22px; top: 40px; right: 40px; transform: rotate(-25deg); }
    .chip-3 { width: 20px; height: 18px; top: 85px; left: 80px; transform: rotate(45deg); }
    .chip-4 { width: 24px; height: 20px; bottom: 35px; left: 40px; transform: rotate(10deg); }
    .chip-5 { width: 22px; height: 22px; bottom: 40px; right: 45px; transform: rotate(-15deg); }
    .chip-6 { width: 18px; height: 16px; top: 80px; left: 25px; transform: rotate(30deg); }
    .chip-7 { width: 19px; height: 18px; top: 85px; right: 25px; transform: rotate(-40deg); }

    /* Floating +1 animation */
    .floating-text {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: #d84315;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px) scale(1.3);
      }
    }

    .controls {
      margin-bottom: 1.5rem;
    }

    .btn-reset {
      background-color: #8d6e63;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-reset:hover {
      background-color: #6d4c41;
    }

    .btn-reset:active {
      transform: scale(0.95);
    }

    /* Achievements Section */
    .achievements-section {
      margin-top: 1.5rem;
      border-top: 2px dashed #d7ccc8;
      padding-top: 1.2rem;
      text-align: left;
    }

    .achievements-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .achievements-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #4a2c11;
    }

    .achievements-progress {
      font-size: 0.85rem;
      font-weight: 600;
      background: #e02810;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .achievements-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .achievement-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #f5f5f5;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      transition: all 0.2s ease;
      opacity: 0.55;
      filter: grayscale(80%);
    }

    .achievement-card.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      background: #fff8e1;
      border-color: #ffe082;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .achievement-icon {
      font-size: 1.8rem;
      min-width: 36px;
      text-align: center;
    }

    .achievement-info {
      flex: 1;
    }

    .achievement-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: #3e2723;
    }

    .achievement-desc {
      font-size: 0.78rem;
      color: #757575;
    }

    .achievement-card.unlocked .achievement-desc {
      color: #5d4037;
    }

    .achievement-badge {
      font-size: 0.75rem;
      font-weight: bold;
      color: #388e3c;
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="container">
    <h1>Cookie Clicker</h1>
    <div class="counter-display">
      Clics: <span id="count" class="count-number">0</span>
    </div>

    <div class="cookie-wrapper" id="cookie-btn">
      <div class="cookie">
        <div class="chip chip-1"></div>
        <div class="chip chip-2"></div>
        <div class="chip chip-3"></div>
        <div class="chip chip-4"></div>
        <div class="chip chip-5"></div>
        <div class="chip chip-6"></div>
        <div class="chip chip-7"></div>
      </div>
    </div>

    <div class="controls">
      <button id="reset-btn" class="btn-reset">Reiniciar Contador</button>
    </div>

    <div class="achievements-section">
      <div class="achievements-header">
        <span class="achievements-title">🏆 Logros</span>
        <span id="achievements-progress" class="achievements-progress">0 / 5</span>
      </div>
      <div class="achievements-list" id="achievements-list">
        <!-- Generated by script.js -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
